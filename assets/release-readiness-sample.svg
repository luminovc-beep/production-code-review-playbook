<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Production readiness sample framework</title><desc id="desc">A four-area example covering behavior, security, reliability and operations.</desc>
<rect width="1200" height="900" rx="30" fill="#f7f9fc"/><text x="78" y="95" fill="#9b6b00" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">RELEASE READINESS • GO / NO-GO</text><text x="78" y="175" fill="#101d2c" font-family="Arial,sans-serif" font-size="58" font-weight="700">Readiness is evidence, not confidence.</text><text x="82" y="225" fill="#536273" font-family="Arial,sans-serif" font-size="25">A sample review frame for the last mile before production.</text>
<g font-family="Arial,sans-serif">
<g fill="#eff3f8" stroke="#cad4df" stroke-width="2"><rect x="80" y="285" width="490" height="220" rx="22"/><rect x="630" y="285" width="490" height="220" rx="22"/><rect x="80" y="545" width="490" height="220" rx="22"/><rect x="630" y="545" width="490" height="220" rx="22"/></g>
<g font-size="24" font-weight="700" fill="#a56a00"><text x="120" y="340">01 • BEHAVIOR</text><text x="670" y="340">02 • SECURITY</text><text x="120" y="600">03 • RELIABILITY</text><text x="670" y="600">04 • OPERATIONS</text></g>
<g font-size="22" fill="#233243"><text x="120" y="395"><tspan x="120" dy="0">Acceptance criteria pass. Error cases are</tspan><tspan x="120" dy="32">covered. API and database contracts are</tspan><tspan x="120" dy="32">compatible during rollout.</tspan></text><text x="670" y="395"><tspan x="670" dy="0">Permissions checked server-side. Secrets</tspan><tspan x="670" dy="32">kept out of source. Logs scrubbed.</tspan><tspan x="670" dy="32">Dependencies reviewed.</tspan></text><text x="120" y="655"><tspan x="120" dy="0">Timeouts and retries have budgets.</tspan><tspan x="120" dy="32">Jobs are replay-safe. Capacity and</tspan><tspan x="120" dy="32">dependency failure considered.</tspan></text><text x="670" y="655"><tspan x="670" dy="0">Dashboards and alerts exist. Runbook</tspan><tspan x="670" dy="32">owner is named. Rollback / roll-forward</tspan><tspan x="670" dy="32">plan is tested.</tspan></text></g></g>
<path d="M115 810H1085" stroke="#42b9a3" stroke-width="4"/><g fill="#c2ec64"><circle cx="115" cy="810" r="9"/><circle cx="355" cy="810" r="9"/><circle cx="595" cy="810" r="9"/><circle cx="835" cy="810" r="9"/><circle cx="1085" cy="810" r="9"/></g>
</svg>